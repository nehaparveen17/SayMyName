version: '3'

services:
  app:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:SayMyName@db:5432/postgres

    

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SayMyName
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - /path/to/db/data:/var/lib/postgresql/data

